# server.address=0.0.0.0
server.port=8081
spring.application.name=ecotracker

# ===============================
# MySQL Connection Settings
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local Dev Settings (Commented Out)
# spring.datasource.url=jdbc:mysql://127.0.0.1:3307/ecotracker_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=Is69310$

# ===============================
# Hibernate/JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# GOOGLE SMTP EMAIL CONFIGURATION (PURE SSL)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Core SMTP & SSL Auth
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# Explicit Socket Factory to bypass cloud blocks
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# X-Ray Debug Logs (Prints Google's exact response to Render console)
spring.mail.properties.mail.debug=true